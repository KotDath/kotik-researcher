schema: spec-driven

# Project context: показывается AI при создании артефактов (proposal, specs, design, tasks).
context: |
  Проект: kotik-researcher — десктоп-чат с DeepSeek, задел под исследовательскую платформу.
  Стек: Rust (Cargo workspace в src-tauri: kotik-core / kotik-agent-rig / kotik-cli),
  Tauri 2, React 19 + Vite (JavaScript, не TypeScript).
  Главный инвариант: ядро ≠ агент ≠ UI; kotik-core не импортирует Rig/Tauri;
  новый функционал сначала работает через kotik-cli (TUI-first), UI — тонкий адаптер.
  Процесс: SDD-цикл ведёт primary-оркестратор (.opencode/agents/orchestrator.md):
  артефакты пишет spec-writer после grill-опроса, код — implementer по routing card
  из proposal (Implementation: standard|deep), ревью — reviewer.
  Definition of Done: cargo test, clippy -D warnings, fmt --check, npm run lint, npm run build.
  Полные правила и карта проекта — в AGENTS.md корня репозитория.

