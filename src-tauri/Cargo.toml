[package]
name = "kotik-researcher"
version = "0.1.0"
description = "Tauri-оболочка kotik: тонкий UI-адаптер поверх kotik-core"
edition = "2021"

[workspace]
members = ["crates/*"]

[lib]
# The `_lib` suffix may seem redundant but it is required
# to avoid a name conflict with the main binary.
name = "kotik_researcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
kotik-agent-rig = { path = "crates/kotik-agent-rig" }
kotik-core = { path = "crates/kotik-core" }
futures = "0.3"
