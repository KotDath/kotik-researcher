[package]
name = "kotik-researcher"
version = "0.1.0"
description = "Chat with DeepSeek via Rig"
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is required
# to avoid a name conflict with the main binary.
name = "kotik_researcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rig = { package = "rig-core", version = "0.41" }
futures = "0.3"
